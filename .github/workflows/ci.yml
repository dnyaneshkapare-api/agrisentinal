name: AgriSentinel Security, Lint & Build CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Secret Scan Guard
        run: |
          echo "Scanning codebase for leaked secrets or private keys..."
          ! grep -rn "BEGIN PRIVATE KEY" src/ server.ts || exit 1
          ! grep -rn "AIzaSy" src/ server.ts || exit 1
          echo "Secret scan passed. Zero leaked credentials detected."

      - name: Type Check & Linting
        run: npm run lint

      - name: Production Bundle Build
        run: npm run build

      - name: Verify Security Deliverables
        run: |
          test -f docs/SECURITY_CHECKLIST.md || exit 1
          test -f docs/THREAT_MODEL.md || exit 1
          test -f docs/architecture.md || exit 1
          test -f docs/api.md || exit 1
          test -f docs/model_card.md || exit 1
          test -f .env.example || exit 1
          echo "All required governance and architectural deliverables verified."
